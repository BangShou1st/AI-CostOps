name: ai-costops

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      AICOSTOPS_REDIS_HOST: redis
      AICOSTOPS_REDIS_PORT: 6379
      AICOSTOPS_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AICOSTOPS_STORAGE_ENDPOINT: http://minio:9000
      AICOSTOPS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      AICOSTOPS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AICOSTOPS_STORAGE_BUCKET: ${MINIO_BUCKET}
      AICOSTOPS_JWT_SIGNING_KEY: ${AICOSTOPS_JWT_SIGNING_KEY}
      AICOSTOPS_ALLOW_PUBLIC_REGISTRATION: ${AICOSTOPS_ALLOW_PUBLIC_REGISTRATION}
      PUBLIC_REGISTRATION_ORG_SLUG: ${PUBLIC_REGISTRATION_ORG_SLUG:-local-dev}
      AICOSTOPS_ALLOWED_ORIGINS: ${AICOSTOPS_ALLOWED_ORIGINS:-http://localhost:8080}
      AICOSTOPS_REFRESH_COOKIE_SECURE: ${AICOSTOPS_REFRESH_COOKIE_SECURE:-true}
      AICOSTOPS_DEV_BOOTSTRAP_ENABLED: ${AICOSTOPS_DEV_BOOTSTRAP_ENABLED:-false}
      AICOSTOPS_DEV_BOOTSTRAP_EMAIL: ${AICOSTOPS_DEV_BOOTSTRAP_EMAIL:-admin@example.test}
      AICOSTOPS_DEV_BOOTSTRAP_DISPLAY_NAME: ${AICOSTOPS_DEV_BOOTSTRAP_DISPLAY_NAME:-AI CostOps Local Admin}
      AICOSTOPS_DEV_BOOTSTRAP_PASSWORD: ${AICOSTOPS_DEV_BOOTSTRAP_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AICOSTOPS_DEV_MAILBOX_PATH: /var/lib/aicostops/mailbox
      AICOSTOPS_DEV_RESET_PAGE_URL: http://localhost:${FRONTEND_PORT}/reset-password
      SERVER_FORWARD_HEADERS_STRATEGY: native
      AICOSTOPS_LOGIN_RATE_LIMIT_WINDOW: ${AICOSTOPS_LOGIN_RATE_LIMIT_WINDOW:-15m}
      AICOSTOPS_LOGIN_IP_LIMIT: ${AICOSTOPS_LOGIN_IP_LIMIT:-20}
      AICOSTOPS_LOGIN_ACCOUNT_LIMIT: ${AICOSTOPS_LOGIN_ACCOUNT_LIMIT:-8}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - dev-mailbox-data:/var/lib/aicostops/mailbox
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - aicostops

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - aicostops

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aicostops

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aicostops

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aicostops

networks:
  aicostops:
    name: ai-costops-network

volumes:
  mysql-data:
  redis-data:
  minio-data:
  dev-mailbox-data:
