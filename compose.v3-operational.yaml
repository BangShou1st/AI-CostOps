# V3 Operational Validation Topology
#
# Purpose:
#   Complete V3 execution topology for post-release operational validation.
#   Includes Gateway data plane + deterministic mock Provider.
#
# NOT a production deployment. NOT the default daily dev stack.
#
# Usage:
#   docker compose -f compose.yaml -f compose.v3-operational.yaml \
#     -p aicostops-m21-full --env-file .env up -d --build
#
# Services:
#   - backend (control plane)
#   - frontend (UI)
#   - mysql (financial truth)
#   - redis (cache, NOT financial truth)
#   - minio (evidence storage)
#   - gateway (execution data plane)
#   - mock-provider (deterministic, zero-cost test provider)
#
# Gateway binds to 127.0.0.1 only. Mock Provider is internal network only.

services:
  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AICOSTOPS_GATEWAY_PORT: 8081
      AICOSTOPS_GATEWAY_CREDENTIAL_HMAC_KEY_V1: ${AICOSTOPS_GATEWAY_CREDENTIAL_HMAC_KEY_V1:-}
      AICOSTOPS_GATEWAY_REQUEST_HMAC_KEY_V1: ${AICOSTOPS_GATEWAY_REQUEST_HMAC_KEY_V1:-}
      AICOSTOPS_PROVIDER_KEK_V1: ${AICOSTOPS_PROVIDER_KEK_V1:-}
      AICOSTOPS_GATEWAY_DEV_BOOTSTRAP_ENABLED: ${AICOSTOPS_GATEWAY_DEV_BOOTSTRAP_ENABLED:-true}
      AICOSTOPS_GATEWAY_DEV_RAW_KEY: ${AICOSTOPS_GATEWAY_DEV_RAW_KEY:-}
      AICOSTOPS_GATEWAY_DB_POOL_MAX: ${AICOSTOPS_GATEWAY_DB_POOL_MAX:-12}
      AICOSTOPS_GATEWAY_MAX_ACTIVE_STREAMS: ${AICOSTOPS_GATEWAY_MAX_ACTIVE_STREAMS:-128}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - aicostops

  mock-provider:
    image: python:3.11-alpine
    restart: unless-stopped
    command: ["python", "/mock/mock_provider.py"]
    volumes:
      - ./scripts/m16/mock-provider:/mock:ro
    environment:
      MOCK_PROVIDER_PORT: 8089
    ports:
      - "127.0.0.1:${MOCK_PROVIDER_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8089/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - aicostops
