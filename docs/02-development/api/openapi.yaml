openapi: 3.1.0
info:
  title: AI CostOps V1 API
  version: 1.0.0
  description: AI CostOps V1 前后端接口机器可读契约。ID 与金额均使用字符串传输。
servers:
- url: /api/v1
tags:
- name: Auth
- name: IAM
- name: Organization
- name: Evidence
- name: Import
- name: Cost
- name: Allocation
- name: Expense
- name: Approval
- name: Budget
- name: Ledger
- name: Reconciliation
- name: Period
- name: Reporting
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        code:
          type: string
        traceId:
          type: string
        currentState:
          type:
          - string
          - 'null'
    Id:
      type: string
      pattern: ^[0-9]+$
    DecimalString:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?$
    PageMeta:
      type: object
      required:
      - page
      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
        user:
          type: object
          required:
          - id
          - displayName
          properties:
            id:
              $ref: '#/components/schemas/Id'
            displayName:
              type: string
    RegisterRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
    IdentityResponse:
      type: object
      required: [userId, organizationMemberId, organizationId]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        organizationId: { $ref: '#/components/schemas/Id' }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ForgotPasswordResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    InvitationAcceptRequest:
      type: object
      required: [displayName, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
    MeResponse:
      type: object
      required: [id, email, displayName, organizationId, organizationMemberId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        organizationId: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
    EvidenceUploadResponse:
      type: object
      required:
      - evidenceId
      - deduplicated
      - sha256
      - importBatchId
      properties:
        evidenceId:
          $ref: '#/components/schemas/Id'
        deduplicated:
          type: boolean
        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        importBatchId:
          $ref: '#/components/schemas/Id'
    Budget:
      type: object
      required:
      - id
      - currency
      - totalAmount
      - actualAmount
      - committedAmount
      - availableAmount
      - overBudget
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        billingPeriodId:
          $ref: '#/components/schemas/Id'
        scopeType:
          type: string
          enum:
          - PROJECT
          - COST_CENTER
        scopeId:
          $ref: '#/components/schemas/Id'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        totalAmount:
          $ref: '#/components/schemas/DecimalString'
        actualAmount:
          $ref: '#/components/schemas/DecimalString'
        committedAmount:
          $ref: '#/components/schemas/DecimalString'
        availableAmount:
          $ref: '#/components/schemas/DecimalString'
        overBudget:
          type: boolean
        version:
          type: integer
          minimum: 0
    BillingPeriod:
      type: object
      required:
      - id
      - startDate
      - endDate
      - status
      - closeGeneration
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSING
          - CLOSED
        closeGeneration:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
  responses:
    Problem:
      description: 业务或请求错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      summary: 密码登录
      tags:
      - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/register:
    post:
      summary: 公开注册（受 Feature Flag 控制）
      tags:
      - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/refresh:
    post:
      summary: 旋转 Refresh Session
      tags:
      - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      security: []
  /auth/logout:
    post:
      summary: 注销当前 Session
      tags:
      - Auth
      responses:
        '204':
          description: Session revoked and refresh cookie cleared
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/logout-all:
    post:
      summary: 注销全部 Session
      tags:
      - Auth
      responses:
        '204':
          description: Durable security version increment completed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/password/forgot:
    post:
      summary: 创建密码重置 Challenge
      tags:
      - Auth
      responses:
        '202':
          description: Generic acceptance response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
  /auth/password/reset:
    post:
      summary: 重置密码
      tags:
      - Auth
      responses:
        '204':
          description: Password changed and sessions invalidated
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /auth/me:
    get:
      summary: 读取当前身份与权限上下文
      tags:
      - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /invitations/{token}/accept:
    post:
      summary: 接受邀请
      tags:
      - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
  /users:
    get:
      summary: 查询用户
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`USER_READ`。
  /users/{id}:
    get:
      summary: 读取用户
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`USER_READ`。
  /users/{id}/status:
    patch:
      summary: 修改用户状态
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`USER_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /roles:
    get:
      summary: 查询角色
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`ROLE_READ`。
  /permissions:
    get:
      summary: 查询权限
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`ROLE_READ`。
  /role-assignments:
    post:
      summary: 创建角色分配
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`ROLE_ASSIGN`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /role-assignments/{id}:
    delete:
      summary: 撤销角色分配
      tags:
      - IAM
      responses:
        '200':
          description: 成功
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`ROLE_ASSIGN`。
  /invitations:
    post:
      summary: 创建邀请
      tags:
      - IAM
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`USER_INVITE`。
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: 调用方生成的幂等键
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /projects:
    get:
      summary: 查询项目
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROJECT_READ`。
    post:
      summary: 创建项目
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROJECT_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /projects/{id}:
    patch:
      summary: 修改项目
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROJECT_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /projects/{id}/members:
    post:
      summary: 添加项目成员
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROJECT_MEMBER_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /projects/{id}/members/{memberId}:
    delete:
      summary: 移除项目成员
      tags:
      - Organization
      responses:
        '200':
          description: 成功
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROJECT_MEMBER_MANAGE`。
  /teams:
    get:
      summary: 查询团队
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`TEAM_READ`。
    post:
      summary: 创建团队
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`TEAM_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /cost-centers:
    get:
      summary: 查询成本中心
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`COST_CENTER_READ`。
    post:
      summary: 创建成本中心
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`COST_CENTER_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /provider-accounts:
    get:
      summary: 查询 Provider Account
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROVIDER_ACCOUNT_READ`。
    post:
      summary: 创建 Provider Account
      tags:
      - Organization
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 权限：`PROVIDER_ACCOUNT_MANAGE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /evidence:
    get:
      summary: 查询 Evidence
      tags:
      - Evidence
      responses:
        '200':
          description: 成功
          content:
            application/json:
