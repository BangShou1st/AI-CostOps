openapi: 3.1.0
info:
  title: AI CostOps API
  version: 1.0.0
  description: Authentication, organization administration, evidence/import workflow, canonical costs, budget commitments, and the M5 immutable ledger API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/MasterDataStatus' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Problem:
      description: RFC 9457-style request, authentication, authorization, visibility, state, or dependency error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id: { type: string, pattern: '^[0-9]+$' }
    SecurityVersion: { type: string, pattern: '^[0-9]+$' }
    ExpectedVersion: { type: string, pattern: '^[0-9]+$' }
    UserStatus: { type: string, enum: [ACTIVE, DISABLED] }
    MemberStatus: { type: string, enum: [ACTIVE, DISABLED] }
    MasterDataStatus: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
    ScopeType: { type: string, enum: [ORG, PROJECT, TEAM, COST_CENTER] }
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        currentState: { type: string }
    PageRequest:
      type: object
      required: [page, size]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
    PageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginUser:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/LoginUser' }
    RegisterRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
    IdentityResponse:
      type: object
      required: [userId, organizationMemberId, organizationId]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        organizationId: { $ref: '#/components/schemas/Id' }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    ForgotPasswordResponse:
      type: object
      required: [accepted]
      properties: { accepted: { type: boolean } }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    InvitationAcceptRequest:
      type: object
      required: [displayName, password]
      properties:
        displayName: { type: string, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
    MeResponse:
      type: object
      required: [id, email, displayName, organizationId, organizationMemberId, permissions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        organizationId: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
    Permission:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
    PermissionCatalog: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Role:
      type: object
      required: [id, code, name, permissions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        permissions: { $ref: '#/components/schemas/PermissionCatalog' }
    RoleCatalog: { type: array, items: { $ref: '#/components/schemas/Role' } }
    RoleReference:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
    RoleAssignment:
      type: object
      required: [id, role, scopeType, scopeId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/RoleReference' }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
    OrganizationMember:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        employeeNo: { type: [string, 'null'] }
        defaultCostCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    User:
      type: object
      required: [id, email, displayName, status, securityVersion, organizationMember, roleAssignments]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        securityVersion: { $ref: '#/components/schemas/SecurityVersion' }
        organizationMember: { $ref: '#/components/schemas/OrganizationMember' }
        roleAssignments: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
    PageResponseUser:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } } }
    UpdateUserStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    CreateRoleAssignmentRequest:
      type: object
      required: [organizationMemberId, roleId, scopeType, scopeId]
      properties:
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        roleId: { $ref: '#/components/schemas/Id' }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { $ref: '#/components/schemas/Id' }
    CreateInvitationRequest:
      type: object
      required: [email, initialRoleCode]
      properties:
        email: { type: string, format: email }
        initialRoleCode: { type: string }
        expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    Invitation:
      type: object
      required: [id, email, initialRoleCode, status, expiresAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        initialRoleCode: { type: string }
        status: { type: string, enum: [PENDING] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreateMasterDataRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 200 }
    UpdateMasterDataRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
    MasterData:
      type: object
      required: [id, code, name, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseProject:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterData' } } } }]
    PageResponseTeam:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterData' } } } }]
    PageResponseCostCenter:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterData' } } } }]
    AddMemberRequest:
      type: object
      required: [organizationMemberId]
      properties: { organizationMemberId: { $ref: '#/components/schemas/Id' } }
    Membership:
      type: object
      required: [id, organizationMemberId, userId, email, displayName, userStatus, status, joinedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        userId: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        userStatus: { $ref: '#/components/schemas/UserStatus' }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        joinedAt: { type: string, format: date-time }
    PageResponseMembership:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Membership' } } } }]
    CreateProviderAccountRequest:
      type: object
      required: [providerCode, displayName]
      properties:
        providerCode: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        externalAccountRef: { type: [string, 'null'], maxLength: 255 }
        metadata: { type: object, additionalProperties: true, description: Non-secret metadata only. }
    UpdateProviderAccountRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        externalAccountRef: { type: [string, 'null'], maxLength: 255 }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        metadata: { type: object, additionalProperties: true, description: Non-secret metadata only. }
    ProviderAccount:
      type: object
      required: [id, providerCode, displayName, status, metadata, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        providerCode: { type: string }
        displayName: { type: string }
        externalAccountRef: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseProviderAccount:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ProviderAccount' } } } }]
    ImportStatus: { type: string, enum: [PENDING, PROCESSING, PARSED, READY_FOR_REVIEW, CONFIRMED, FAILED, CANCELED] }
    AttemptStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED] }
    AttemptTrigger: { type: string, enum: [INITIAL, MANUAL_RETRY, LEASE_RECOVERY] }
    SourceType: { type: string, enum: [FILE_EXPORT, USAGE_API_JSON, COSTS_API_JSON] }
    NormalizeStatus: { type: string, enum: [NORMALIZED, WARN, ERROR] }
    StorageStatus: { type: string, enum: [STAGING, AVAILABLE, FAILED] }
    EvidenceRef:
      type: object
      required: [id, originalFilename]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        originalFilename: { type: string }
    ProviderAccountRef:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
    AttemptResponse:
      type: object
      required: [id, attemptNo, status, triggerType, parserVersion, recordsSeen, recordsValid, warningCount, errorCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        attemptNo: { type: integer }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        triggerType: { $ref: '#/components/schemas/AttemptTrigger' }
        predecessorAttemptId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        parserVersion: { type: string }
        detectedProviderCode: { type: [string, 'null'] }
        schemaFingerprint: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        recordsSeen: { type: integer, format: int64 }
        recordsValid: { type: integer, format: int64 }
        warningCount: { type: integer, format: int64 }
        errorCount: { type: integer, format: int64 }
        errorCode: { type: [string, 'null'] }
        errorSummary: { type: [string, 'null'] }
    ImportResponse:
      type: object
      required: [id, evidence, providerAccount, expectedProviderCode, sourceType, parserVersion, status, createdByMemberId, createdAt, updatedAt, retryable, cancelable]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        evidence: { $ref: '#/components/schemas/EvidenceRef' }
        providerAccount: { $ref: '#/components/schemas/ProviderAccountRef' }
        expectedProviderCode: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        parserVersion: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        latestAttempt: { anyOf: [{ $ref: '#/components/schemas/AttemptResponse' }, { type: 'null' }] }
        createdByMemberId: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAttemptId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        retryable: { type: boolean }
        cancelable: { type: boolean }
    IssueResponse:
      type: object
      required: [id, severity, issueCode, recordLocator, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        rawProviderRecordId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        severity: { type: string, enum: [WARN, ERROR] }
        issueCode: { type: string }
        recordLocator: { type: [string, 'null'] }
        fieldName: { type: [string, 'null'] }
        message: { type: string }
        rawValueMasked: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    KeySummaryResponse:
      type: object
      required: [keyCount, keys, keysTruncated]
      properties:
        keyCount: { type: integer }
        keys: { type: array, items: { type: string } }
        keysTruncated: { type: boolean }
    RawRecordSummaryResponse:
      type: object
      required: [id, recordIndex, recordLocator, normalizeStatus, rawPayloadKeys, normalizedPayloadKeys, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        recordIndex: { type: integer, format: int64 }
        recordLocator: { type: string }
        providerRecordKey: { type: [string, 'null'] }
        normalizeStatus: { $ref: '#/components/schemas/NormalizeStatus' }
        usageStart: { type: [string, 'null'], format: date-time }
        usageEnd: { type: [string, 'null'], format: date-time }
        rawPayloadKeys: { $ref: '#/components/schemas/KeySummaryResponse' }
        normalizedPayloadKeys: { $ref: '#/components/schemas/KeySummaryResponse' }
        createdAt: { type: string, format: date-time }
    RawRecordDetailResponse:
      type: object
      required: [id, recordIndex, recordLocator, normalizeStatus, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        recordIndex: { type: integer, format: int64 }
        recordLocator: { type: string }
        providerRecordKey: { type: [string, 'null'] }
        normalizeStatus: { $ref: '#/components/schemas/NormalizeStatus' }
        usageStart: { type: [string, 'null'], format: date-time }
        usageEnd: { type: [string, 'null'], format: date-time }
        rawPayload: { type: [object, 'null'], additionalProperties: true }
        normalizedPayload: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    EvidenceResponse:
      type: object
      required: [id, originalFilename, mediaType, sizeBytes, sha256, storageStatus, uploadedByMemberId, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        originalFilename: { type: string }
        mediaType: { type: [string, 'null'] }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        storageStatus: { $ref: '#/components/schemas/StorageStatus' }
        storageErrorCode: { type: [string, 'null'] }
        uploadedByMemberId: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProviderImportResponse:
      type: object
      required: [evidenceId, importBatchId, latestAttemptId, batchStatus, duplicateEvidence, duplicateBatch]
      properties:
        evidenceId: { $ref: '#/components/schemas/Id' }
        importBatchId: { $ref: '#/components/schemas/Id' }
        latestAttemptId: { $ref: '#/components/schemas/Id' }
        batchStatus: { $ref: '#/components/schemas/ImportStatus' }
        duplicateEvidence: { type: boolean }
        duplicateBatch: { type: boolean }
    PageResponseImport:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ImportResponse' } } } }]
    PageResponseAttempt:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AttemptResponse' } } } }]
    PageResponseIssue:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/IssueResponse' } } } }]
    PageResponseRawRecordSummary:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RawRecordSummaryResponse' } } } }]
    PageResponseEvidence:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/EvidenceResponse' } } } }]
    CandidateStatus: { type: string, enum: [OPEN, KEPT_CLEAN, CONFIRMED_DUPLICATE, SUPERSEDED] }
    CandidateType: { type: string, enum: [EXACT, OVERLAP] }
    ChargeReviewStatus: { type: string, enum: [CLEAN, SUSPECTED_DUPLICATE, EXCLUDED_DUPLICATE, EXCLUDED_NONCOST] }
    DuplicateChargeRef:
      type: object
      required: [id, providerCode, chargeCategory, amount, currency, reviewStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        providerCode: { type: string }
        chargeCategory: { type: string }
        amount: { type: string, pattern: '^-?[0-9]+\\.[0-9]{8}$' }
        currency: { type: string }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        reviewStatus: { $ref: '#/components/schemas/ChargeReviewStatus' }
        duplicateOfChargeId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    DuplicateCandidateResponse:
      type: object
      required: [id, candidateType, fingerprint, algorithmVersion, matchReason, status, chargeFact, matchedChargeFact, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        candidateType: { $ref: '#/components/schemas/CandidateType' }
        fingerprint: { type: string }
        algorithmVersion: { type: string }
        matchReason: { type: string }
        status: { $ref: '#/components/schemas/CandidateStatus' }
        chargeFact: { $ref: '#/components/schemas/DuplicateChargeRef' }
        matchedChargeFact: { $ref: '#/components/schemas/DuplicateChargeRef' }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    PageResponseDuplicateCandidate:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DuplicateCandidateResponse' } } } }]
    DuplicateExcludeRequest:
      type: object
      required: [excludedChargeFactId]
      properties:
        excludedChargeFactId: { $ref: '#/components/schemas/Id' }
    DuplicateScanResponse:
      type: object
      required: [chargesScanned, candidatePairsEvaluated, candidatesCreated, candidatesAlreadyPresent, scannedAt]
      properties:
        chargesScanned: { type: integer, format: int64 }
        candidatePairsEvaluated: { type: integer, format: int64 }
        candidatesCreated: { type: integer, format: int64 }
        candidatesAlreadyPresent: { type: integer, format: int64 }
        scannedAt: { type: string, format: date-time }

    Money: { type: string, pattern: '^-?[0-9]+\.[0-9]{8}$' }
    ChargeCostResponse:
      type: object
      required: [id, providerCode, chargeCategory, amount, currency, reviewStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        providerCode: { type: string }
        chargeCategory: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        reviewStatus: { $ref: '#/components/schemas/ChargeReviewStatus' }
        currentAllocationDecisionId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    ChargeCostDetailResponse:
      type: object
      required: [id, providerCode, chargeCategory, amount, currency, reviewStatus, confirmedImport]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        providerCode: { type: string }
        chargeCategory: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        reviewStatus: { $ref: '#/components/schemas/ChargeReviewStatus' }
        currentAllocationDecisionId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        duplicateOfChargeId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        confirmedImport: { type: boolean }
    PageResponseChargeCost:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ChargeCostResponse' } } } }]
    AllocationDecisionStatus: { type: string, enum: [DRAFT, CONFIRMED, SUPERSEDED] }
    AllocationDecisionSource: { type: string, enum: [MANUAL, RULE] }
    AllocationSubjectType: { type: string, enum: [CHARGE_FACT, EXPENSE_CLAIM] }
    AllocationRuleMatchType: { type: string, enum: [PROVIDER_API_KEY, PROVIDER_PROJECT, PROVIDER_USER] }
    AllocationRuleStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    AllocationRuleTrace:
      type: object
      required: [id, ruleKey, version, priority]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        ruleKey: { type: string }
        version: { type: integer }
        priority: { type: integer }
    AllocationLineResponse:
      type: object
      required: [lineIndex, allocatedAmount, currency]
      properties:
        lineIndex: { type: integer }
        allocatedAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        projectId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        costCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        teamId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    AllocationDecisionResponse:
      type: object
      required: [id, subjectType, source, status, createdAt, lines]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        subjectType: { $ref: '#/components/schemas/AllocationSubjectType' }
        chargeFactId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        expenseClaimId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        source: { $ref: '#/components/schemas/AllocationDecisionSource' }
        status: { $ref: '#/components/schemas/AllocationDecisionStatus' }
        allocationRule: { oneOf: [{ $ref: '#/components/schemas/AllocationRuleTrace' }, { type: 'null' }] }
        createdByMemberId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/AllocationLineResponse' } }
    AllocationProposalStatus: { type: string, enum: [CREATED, REUSED, NO_MATCH] }
    AllocationProposalReason: { type: string, enum: [NO_EFFECTIVE_TIME, NO_RULE_MATCH] }
    AllocationProposalResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AllocationProposalStatus' }
        decision: { oneOf: [{ $ref: '#/components/schemas/AllocationDecisionResponse' }, { type: 'null' }] }
        ruleTrace: { oneOf: [{ $ref: '#/components/schemas/AllocationRuleTrace' }, { type: 'null' }] }
        reason: { oneOf: [{ $ref: '#/components/schemas/AllocationProposalReason' }, { type: 'null' }] }
    AllocationLineRequest:
      type: object
      required: [allocatedAmount, currency]
      properties:
        allocatedAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        projectId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        costCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        teamId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    ManualDraftRequest:
      type: object
      required: [lines]
      properties:
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AllocationLineRequest' } }
    ReplaceLinesRequest:
      type: object
      required: [lines]
      properties:
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AllocationLineRequest' } }
    ExpenseClaimStatus: { type: string, enum: [DRAFT, SUBMITTED, NEEDS_INFO, APPROVED, POSTED, REJECTED, CANCELED] }
    ApprovalActionType: { type: string, enum: [SUBMIT, REQUEST_INFO, RESUBMIT, APPROVE, REJECT, CANCEL] }
    ExpenseApprovalActionResponse:
      type: object
      required: [id, actionType, actorMemberId, fromState, toState, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        actionType: { $ref: '#/components/schemas/ApprovalActionType' }
        actorMemberId: { $ref: '#/components/schemas/Id' }
        fromState: { type: string }
        toState: { type: string }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    ExpenseResponse:
      type: object
      required: [id, status, claimantMemberId, expenseDate, amount, currency, postingReady, canEdit, version, createdAt, updatedAt, history]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ExpenseClaimStatus' }
        claimantMemberId: { $ref: '#/components/schemas/Id' }
        evidenceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        expenseDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        currentAllocationDecisionId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        approvalCaseId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        approvalStatus: { oneOf: [{ $ref: '#/components/schemas/ApprovalCaseStatus' }, { type: 'null' }] }
        postingReady: { type: boolean }
        canEdit: { type: boolean }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history: { type: array, items: { $ref: '#/components/schemas/ExpenseApprovalActionResponse' } }
    ExpenseSummaryResponse:
      type: object
      required: [id, status, expenseDate, amount, currency, postingReady, version, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ExpenseClaimStatus' }
        evidenceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        expenseDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        approvalStatus: { oneOf: [{ $ref: '#/components/schemas/ApprovalCaseStatus' }, { type: 'null' }] }
        postingReady: { type: boolean }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    LedgerSourceType: { type: string, enum: [PROVIDER_CHARGE, EXPENSE_CLAIM, CORRECTION] }
    LedgerEntryType: { type: string, enum: [COST, CREDIT, ADJUSTMENT, REVERSAL] }
    CorrectionMode: { type: string, enum: [REVERSAL_ONLY, REPLACE] }
    CommitmentLinkRequest:
      type: object
      required: [allocationLineId, commitmentId]
      properties:
        allocationLineId: { $ref: '#/components/schemas/Id' }
        commitmentId: { $ref: '#/components/schemas/Id' }
    PostSourceRequest:
      type: object
      required: [commitmentLinks]
      properties:
        commitmentLinks: { type: array, items: { $ref: '#/components/schemas/CommitmentLinkRequest' } }
    LedgerEntryResponse:
      type: object
      required: [id, postingId, entryIndex, entryType, amount, currency, targetType, targetId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        postingId: { $ref: '#/components/schemas/Id' }
        entryIndex: { type: integer, minimum: 0 }
        entryType: { $ref: '#/components/schemas/LedgerEntryType' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        targetType: { $ref: '#/components/schemas/ScopeType' }
        targetId: { $ref: '#/components/schemas/Id' }
        budgetId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        sourceChargeFactId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        sourceExpenseClaimId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        allocationLineId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        correctionGroupId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        reversesEntryId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    LedgerPostingSummaryResponse:
      type: object
      required: [id, postingKey, sourceType, sourceId, billingPeriodId, status, postedByMemberId, postedAt, createdAt, visibleEntryCount, visibleTotals, entries]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        postingKey: { type: string }
        sourceType: { $ref: '#/components/schemas/LedgerSourceType' }
        sourceId: { $ref: '#/components/schemas/Id' }
        allocationDecisionId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        billingPeriodId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [POSTED] }
        postedByMemberId: { $ref: '#/components/schemas/Id' }
        postedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        visibleEntryCount: { type: integer, minimum: 0 }
        visibleTotalAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        visibleCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        visibleTotals: { type: object, additionalProperties: { $ref: '#/components/schemas/Money' } }
        entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntryResponse' } }
    LedgerPostingDetailResponse:
      type: object
      required: [id, postingKey, sourceType, sourceId, billingPeriodId, status, postedByMemberId, postedAt, createdAt, entries]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        postingKey: { type: string }
        sourceType: { $ref: '#/components/schemas/LedgerSourceType' }
        sourceId: { $ref: '#/components/schemas/Id' }
        allocationDecisionId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        billingPeriodId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [POSTED] }
        postedByMemberId: { $ref: '#/components/schemas/Id' }
        postedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntryResponse' } }
    LedgerLineageResponse:
      type: object
      properties:
        allocationLineId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        allocationDecisionId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        allocationDecisionStatus: { type: [string, 'null'] }
        chargeFactId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        chargeProviderCode: { type: [string, 'null'] }
        chargeReviewStatus: { type: [string, 'null'] }
        rawProviderRecordId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        importAttemptId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        importBatchId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        providerEvidenceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        expenseClaimId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        expenseStatus: { type: [string, 'null'] }
        expenseEvidenceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        correctionGroupId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        reversesEntryId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    LedgerEntryDetailResponse:
      type: object
      required: [entry, posting, lineage]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntryResponse' }
        posting: { $ref: '#/components/schemas/LedgerPostingSummaryResponse' }
        lineage: { $ref: '#/components/schemas/LedgerLineageResponse' }
    LedgerCorrectionResponse:
      type: object
      required: [correctionGroupId, posting]
      properties:
        correctionGroupId: { $ref: '#/components/schemas/Id' }
        posting: { $ref: '#/components/schemas/LedgerPostingDetailResponse' }
    PageResponseLedgerPosting:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/LedgerPostingSummaryResponse' } } } }]
    PageResponseLedgerEntry:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/LedgerEntryResponse' } } } }]
    CorrectionReplacementRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        projectId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        costCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        teamId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    CorrectionRequest:
      type: object
      required: [targetEntryId, correctionPeriodId, mode, reasonCode]
      properties:
        targetEntryId: { $ref: '#/components/schemas/Id' }
        correctionPeriodId: { $ref: '#/components/schemas/Id' }
        mode: { $ref: '#/components/schemas/CorrectionMode' }
        reasonCode: { type: string, minLength: 1, maxLength: 64 }
        reasonText: { type: [string, 'null'], maxLength: 2000 }
        replacement: { oneOf: [{ $ref: '#/components/schemas/CorrectionReplacementRequest' }, { type: 'null' }] }
    BudgetCommitmentStatus: { type: string, enum: [REQUESTED, ACTIVE, PARTIALLY_CONSUMED, CONSUMED, RELEASED, REJECTED, CANCELED] }
    CreateCommitmentRequest:
      type: object
      required: [requestedAmount, currency]
      properties:
        requestedAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
    RejectCommitmentRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        comment: { type: string, maxLength: 2000 }
    CommitmentApprovalActionResponse:
      type: object
      required: [id, approvalCaseId, actorMemberId, actionType, fromState, toState, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        approvalCaseId: { $ref: '#/components/schemas/Id' }
        actorMemberId: { $ref: '#/components/schemas/Id' }
        actionType: { type: string, enum: [SUBMIT, REQUEST_INFO, RESUBMIT, APPROVE, REJECT, CANCEL] }
        fromState: { oneOf: [{ type: string }, { type: 'null' }] }
        toState: { oneOf: [{ type: string }, { type: 'null' }] }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    CommitmentResponse:
      type: object
      required: [id, budgetId, status, requestedAmount, version, createdAt, updatedAt, history]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        budgetId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/BudgetCommitmentStatus' }
        requestedAmount: { $ref: '#/components/schemas/Money' }
        approvedAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        remainingAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvalCaseId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        approvalStatus: { oneOf: [{ $ref: '#/components/schemas/ApprovalCaseStatus' }, { type: 'null' }] }
        history: { type: array, items: { $ref: '#/components/schemas/CommitmentApprovalActionResponse' } }
    PageResponseCommitment: { type: object, required: [items, page, size, totalElements, totalPages], properties: { items: { type: array, items: { $ref: '#/components/schemas/CommitmentResponse' } }, page: { type: integer }, size: { type: integer }, totalElements: { type: integer }, totalPages: { type: integer } } }
    ApprovalCaseStatus: { type: string, enum: [PENDING, NEEDS_INFO, APPROVED, REJECTED, CANCELED] }
    PageResponseExpense: { type: object, required: [items, page, size, totalElements, totalPages], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExpenseSummaryResponse' } }, page: { type: integer }, size: { type: integer }, totalElements: { type: integer }, totalPages: { type: integer } } }
    CreateExpenseRequest:
      type: object
      required: [expenseDate, amount, currency]
      properties:
        expenseDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
    EditExpenseRequest:
      type: object
      required: [expenseDate, amount, currency, expectedVersion]
      properties:
        expenseDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        expectedVersion: { type: integer, minimum: 0 }
    ExpectedVersionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    CommentedVersionRequest:
      type: object
      required: [expectedVersion, comment]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        comment: { type: string, maxLength: 2000 }
    AllocationRuleResponse:
      type: object
      required: [id, ruleKey, version, name, providerCode, matchHintType, matchValue, priority, effectiveFrom, status, createdByMemberId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        ruleKey: { type: string }
        version: { type: integer }
        name: { type: string }
        providerCode: { type: string }
        providerAccountId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        matchHintType: { $ref: '#/components/schemas/AllocationRuleMatchType' }
        matchValue: { type: string }
        priority: { type: integer }
        targetProjectId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        targetCostCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        targetTeamId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/AllocationRuleStatus' }
        createdByMemberId: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
    PageResponseAllocationRule:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AllocationRuleResponse' } } } }]
    AllocationTargetResponse:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [PROJECT, COST_CENTER, TEAM] }
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    RuleVersionRequest:
      type: object
      required: [name, providerCode, matchHintType, matchValue, priority, effectiveFrom]
      properties:
        name: { type: string }
        providerCode: { type: string }
        providerAccountId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        matchHintType: { $ref: '#/components/schemas/AllocationRuleMatchType' }
        matchValue: { type: string }
        priority: { type: integer }
        targetProjectId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        targetCostCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        targetTeamId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
    BillingPeriodResponse:
      type: object
      required: [id, periodStart, periodEnd, status, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, CLOSING, CLOSED] }
        version: { type: integer, minimum: 0 }
    BudgetResponse:
      type: object
      required: [id, billingPeriodId, scopeType, scopeId, currency, totalAmount, actualAmount, committedAmount, availableAmount, overBudget, status, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        billingPeriodId: { $ref: '#/components/schemas/Id' }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { $ref: '#/components/schemas/Id' }
        currency: { type: string }
        totalAmount: { $ref: '#/components/schemas/Money' }
        actualAmount: { $ref: '#/components/schemas/Money' }
        committedAmount: { $ref: '#/components/schemas/Money' }
        availableAmount: { $ref: '#/components/schemas/Money', description: Server-computed total - actual - committed; never a second stored authority. }
        overBudget: { type: boolean, description: availableAmount is negative. }
        status: { type: string, enum: [ACTIVE] }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseBudget:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/BudgetResponse' } } }
    CreateBudgetRequest:
      type: object
      required: [billingPeriodId, scopeType, scopeId, currency, totalAmount]
      properties:
        billingPeriodId: { $ref: '#/components/schemas/Id' }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { $ref: '#/components/schemas/Id' }
        currency: { type: string }
        totalAmount: { $ref: '#/components/schemas/Money' }
    UpdateBudgetRequest:
      description: Only manageable fields are accepted; financial counters (actualAmount / committedAmount) are never writable through the management API.
      type: object
      required: [totalAmount, expectedVersion]
      properties:
        totalAmount: { $ref: '#/components/schemas/Money' }
        expectedVersion: { type: integer, minimum: 0 }

paths:
  /auth/login:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/register:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '200': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/refresh:
    post:
      security: []
      responses: { '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/logout:
    post:
      responses: { '204': { description: Logged out }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/logout-all:
    post:
      responses: { '204': { description: All sessions revoked }, '401': { $ref: '#/components/responses/Problem' } }
  /auth/password/forgot:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } } }
      responses: { '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/password/reset:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } } }
      responses: { '204': { description: Password reset }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/me:
    get:
      responses: { '200': { description: Current identity and M1 permission projection, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /invitations/{token}/accept:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAcceptRequest' } } } }
      responses: { '200': { description: Invitation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /users:
