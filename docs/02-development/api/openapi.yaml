openapi: 3.1.0
info:
  title: AI CostOps M1 API
  version: 1.0.0
  description: Authentication, organization administration, and explicit-scope authorization contracts delivered in M1.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/MasterDataStatus' }
  responses:
    Problem:
      description: RFC 9457-style request, authentication, authorization, visibility, state, or dependency error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id: { type: string, pattern: '^[0-9]+$' }
    SecurityVersion: { type: string, pattern: '^[0-9]+$' }
    ExpectedVersion: { type: string, pattern: '^[0-9]+$' }
    UserStatus: { type: string, enum: [ACTIVE, DISABLED] }
    MemberStatus: { type: string, enum: [ACTIVE, DISABLED] }
    MasterDataStatus: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
    ScopeType: { type: string, enum: [ORG, PROJECT, TEAM, COST_CENTER] }
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        currentState: { type: string }
    PageRequest:
      type: object
      required: [page, size]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
    PageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginUser:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/LoginUser' }
    RegisterRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
    IdentityResponse:
      type: object
      required: [userId, organizationMemberId, organizationId]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        organizationId: { $ref: '#/components/schemas/Id' }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    ForgotPasswordResponse:
      type: object
      required: [accepted]
      properties: { accepted: { type: boolean } }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    InvitationAcceptRequest:
      type: object
      required: [displayName, password]
      properties:
        displayName: { type: string, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
    MeResponse:
      type: object
      required: [id, email, displayName, organizationId, organizationMemberId, permissions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        organizationId: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
    Permission:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
    PermissionCatalog: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Role:
      type: object
      required: [id, code, name, permissions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        permissions: { $ref: '#/components/schemas/PermissionCatalog' }
    RoleCatalog: { type: array, items: { $ref: '#/components/schemas/Role' } }
    RoleReference:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
    RoleAssignment:
      type: object
      required: [id, role, scopeType, scopeId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/RoleReference' }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
    OrganizationMember:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        employeeNo: { type: [string, 'null'] }
        defaultCostCenterId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    User:
      type: object
      required: [id, email, displayName, status, securityVersion, organizationMember, roleAssignments]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        securityVersion: { $ref: '#/components/schemas/SecurityVersion' }
        organizationMember: { $ref: '#/components/schemas/OrganizationMember' }
        roleAssignments: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
    PageResponseUser:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } } }
    UpdateUserStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    CreateRoleAssignmentRequest:
      type: object
      required: [organizationMemberId, roleId, scopeType, scopeId]
      properties:
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        roleId: { $ref: '#/components/schemas/Id' }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { $ref: '#/components/schemas/Id' }
    CreateInvitationRequest:
      type: object
      required: [email, initialRoleCode]
      properties:
        email: { type: string, format: email }
        initialRoleCode: { type: string }
        expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    Invitation:
      type: object
      required: [id, email, initialRoleCode, status, expiresAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        initialRoleCode: { type: string }
        status: { type: string, enum: [PENDING] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreateMasterDataRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 200 }
    UpdateMasterDataRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
    MasterData:
      type: object
      required: [id, code, name, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseProject:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterData' } } } }]
    PageResponseTeam:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterData' } } } }]
    PageResponseCostCenter:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterData' } } } }]
    AddMemberRequest:
      type: object
      required: [organizationMemberId]
      properties: { organizationMemberId: { $ref: '#/components/schemas/Id' } }
    Membership:
      type: object
      required: [id, organizationMemberId, userId, email, displayName, userStatus, status, joinedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organizationMemberId: { $ref: '#/components/schemas/Id' }
        userId: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        userStatus: { $ref: '#/components/schemas/UserStatus' }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        joinedAt: { type: string, format: date-time }
    PageResponseMembership:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Membership' } } } }]
    CreateProviderAccountRequest:
      type: object
      required: [providerCode, displayName]
      properties:
        providerCode: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        externalAccountRef: { type: [string, 'null'], maxLength: 255 }
        metadata: { type: object, additionalProperties: true, description: Non-secret metadata only. }
    UpdateProviderAccountRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        externalAccountRef: { type: [string, 'null'], maxLength: 255 }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        metadata: { type: object, additionalProperties: true, description: Non-secret metadata only. }
    ProviderAccount:
      type: object
      required: [id, providerCode, displayName, status, metadata, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        providerCode: { type: string }
        displayName: { type: string }
        externalAccountRef: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/MasterDataStatus' }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseProviderAccount:
      allOf: [{ $ref: '#/components/schemas/PageResponse' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ProviderAccount' } } } }]

paths:
  /auth/login:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/register:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '200': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/refresh:
    post:
      security: []
      responses: { '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/logout:
    post:
      responses: { '204': { description: Logged out }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/logout-all:
    post:
      responses: { '204': { description: All sessions revoked }, '401': { $ref: '#/components/responses/Problem' } }
  /auth/password/forgot:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } } }
      responses: { '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/password/reset:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } } }
      responses: { '204': { description: Password reset }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /auth/me:
    get:
      responses: { '200': { description: Current identity and M1 permission projection, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /invitations/{token}/accept:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAcceptRequest' } } } }
      responses: { '200': { description: Invitation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /users:
    get:
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Paged users, content: { application/json: { schema: { $ref: '#/components/schemas/PageResponseUser' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
  /users/{id}:
    get:
      responses: { '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
  /users/{id}/status:
    patch:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserStatusRequest' } } } }
      responses: { '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /roles:
    get:
      responses: { '200': { description: Unpaged role catalog, content: { application/json: { schema: { $ref: '#/components/schemas/RoleCatalog' } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
  /permissions:
    get:
      responses: { '200': { description: Unpaged permission catalog, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionCatalog' } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
  /role-assignments:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoleAssignmentRequest' } } } }
      responses: { '201': { description: Assignment created, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /role-assignments/{id}:
    delete:
      responses: { '204': { description: Assignment revoked }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
  /invitations:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvitationRequest' } } } }
      responses: { '201': { description: Invitation metadata created; raw token is never returned, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /projects:
    get:
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Scoped project page, content: { application/json: { schema: { $ref: '#/components/schemas/PageResponseProject' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMasterDataRequest' } } } }
      responses: { '201': { description: Project created, content: { application/json: { schema: { $ref: '#/components/schemas/MasterData' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /projects/{id}:
    patch:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMasterDataRequest' } } } }
      responses: { '200': { description: Project updated, content: { application/json: { schema: { $ref: '#/components/schemas/MasterData' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/members:
    get:
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Project membership page, content: { application/json: { schema: { $ref: '#/components/schemas/PageResponseMembership' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddMemberRequest' } } } }
      responses: { '201': { description: Project member added, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/members/{memberId}:
    delete:
      responses: { '204': { description: Project membership disabled }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /teams:
    get:
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Scoped team page, content: { application/json: { schema: { $ref: '#/components/schemas/PageResponseTeam' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMasterDataRequest' } } } }
      responses: { '201': { description: Team created, content: { application/json: { schema: { $ref: '#/components/schemas/MasterData' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /teams/{id}:
    patch:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMasterDataRequest' } } } }
      responses: { '200': { description: Team updated, content: { application/json: { schema: { $ref: '#/components/schemas/MasterData' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /teams/{id}/members:
    get:
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Team membership page, content: { application/json: { schema: { $ref: '#/components/schemas/PageResponseMembership' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddMemberRequest' } } } }
      responses: { '201': { description: Team member added, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /teams/{id}/members/{memberId}:
    delete:
      responses: { '204': { description: Team membership disabled }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /cost-centers:
    get:
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Scoped cost-center page, content: { application/json: { schema: { $ref: '#/components/schemas/PageResponseCostCenter' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMasterDataRequest' } } } }
