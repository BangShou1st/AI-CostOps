# Optional observability overlay for AI-CostOps (AIC-077).
#
# Always used together with the base file:
#   docker compose -f compose.yaml -f compose.observability.yaml up -d
#
# Core services (backend/frontend/mysql/redis/minio) are unchanged. Prometheus
# and Grafana are ADDITIONAL services attached to the same `aicostops` network;
# they do NOT become a dependency of the core stack (backend does not depend on
# Grafana, and Grafana only depends on Prometheus startup).
#
# Prometheus exposure is enabled ONLY in this overlay, by appending
# MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE to the backend environment. The
# environment map is merged key-by-key across Compose files, so the base backend
# environment is preserved and `prometheus` is simply added. Core Compose
# continues to expose only its existing default management endpoints.

services:
  backend:
    # Key-by-key merge with base: adds prometheus to the actuator exposure
    # without touching the other backend env vars. Core Compose default exposure
    # (health,info) is unchanged when this overlay is not loaded.
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    # Isolated host port so the smoke script can call the login endpoint from the
    # host without colliding with a concurrently running normal stack on 8080.
    ports:
      - "18080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [aicostops]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards-json:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [aicostops]

# Use an isolated network name so this overlay never shares the base
# `ai-costops-network` with a concurrently running default `ai-costops` project.
# Base services reference `aicostops`; overriding its name here keeps all overlay
# services (backend/mysql/redis/minio/prometheus/grafana) on a separate Docker
# network, avoiding service-name DNS collisions when the normal stack is also up.
networks:
  aicostops:
    name: aicostops-obs-network
