aicostops:
  auth:
    # TEST ONLY. Production application.yml intentionally has no signing-key default.
    jwt-signing-secret: test-source-set-only-signing-secret-with-more-than-32-bytes
  ingestion:
    # Test default: workers stay off so ordinary integration tests are deterministic.
    # Worker/coordinator tests explicitly opt in.
    worker-enabled: false
  gateway:
    settlement:
      worker-enabled: false
  reconciliation:
    # Test default: the stale-run sweep stays off so the shared Testcontainer
    # database is not mutated by a background scheduler between fixtures.
    # Recovery tests call the service directly.
    stale-run-recovery-enabled: false

spring:
  data:
    # Lettuce's 500ms default times out under host storage-latency spikes.
    timeout: 5000
  datasource:
    hikari:
      # Spring caches multiple integration-test contexts against one shared MySQL container.
      maximum-pool-size: 2
      minimum-idle: 0
