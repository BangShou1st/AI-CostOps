spring:
  application:
    name: ai-costops-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: ${AICOSTOPS_MULTIPART_MAX_FILE_SIZE:520MB}
      max-request-size: ${AICOSTOPS_MULTIPART_MAX_REQUEST_SIZE:525MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aicostops?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:aicostops}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  data:
    redis:
      host: ${AICOSTOPS_REDIS_HOST:localhost}
      port: ${AICOSTOPS_REDIS_PORT:6379}
      password: ${AICOSTOPS_REDIS_PASSWORD:}
      timeout: ${AICOSTOPS_REDIS_TIMEOUT:500ms}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Only loopback and RFC1918 peers may supply forwarding headers. In Compose,
      # the Nginx frontend reaches the backend over the private bridge network.
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|::1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}'

aicostops:
  storage:
    endpoint: ${AICOSTOPS_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${AICOSTOPS_STORAGE_ACCESS_KEY:aicostops}
    secret-key: ${AICOSTOPS_STORAGE_SECRET_KEY:change-me-local-only}
    bucket: ${AICOSTOPS_STORAGE_BUCKET:aicostops-evidence}
    # Spring DataSize suffixes are B/KB/MB/GB/TB; "MB" means 1024^2 bytes (binary MiB).
    upload-limit: ${AICOSTOPS_STORAGE_UPLOAD_LIMIT:512MB}
    auto-create-bucket: ${AICOSTOPS_STORAGE_AUTO_CREATE_BUCKET:true}
  ingestion:
    worker-enabled: ${AICOSTOPS_IMPORT_WORKER_ENABLED:true}
    worker-concurrency: ${AICOSTOPS_IMPORT_WORKER_CONCURRENCY:2}
    poll-interval: ${AICOSTOPS_IMPORT_POLL_INTERVAL:1s}
    lease-duration: ${AICOSTOPS_IMPORT_LEASE_DURATION:60s}
    heartbeat-interval: ${AICOSTOPS_IMPORT_HEARTBEAT_INTERVAL:20s}
    max-lease-recoveries: ${AICOSTOPS_IMPORT_MAX_LEASE_RECOVERIES:3}
    persistence-batch-size: ${AICOSTOPS_IMPORT_PERSISTENCE_BATCH_SIZE:500}
    provider-parser:
      max-archive-entries: ${AICOSTOPS_PROVIDER_PARSER_MAX_ARCHIVE_ENTRIES:64}
      max-expanded-bytes: ${AICOSTOPS_PROVIDER_PARSER_MAX_EXPANDED_BYTES:1073741824}
      max-compression-ratio: ${AICOSTOPS_PROVIDER_PARSER_MAX_COMPRESSION_RATIO:100.0}
      compression-ratio-check-after-bytes: ${AICOSTOPS_PROVIDER_PARSER_RATIO_CHECK_AFTER_BYTES:1048576}
  iam:
    context-cache-ttl: ${AICOSTOPS_IAM_CONTEXT_CACHE_TTL:60s}
    invitation-default-lifetime: ${AICOSTOPS_IAM_INVITATION_DEFAULT_LIFETIME:72h}
    invitation-max-lifetime: ${AICOSTOPS_IAM_INVITATION_MAX_LIFETIME:168h}
    dev-invitation-mailbox-path: ${AICOSTOPS_IAM_DEV_INVITATION_MAILBOX_PATH:.local-dev/invitations}
    dev-invite-page-url: ${AICOSTOPS_IAM_DEV_INVITE_PAGE_URL:http://localhost:8080/accept-invitation}
  auth:
    allow-public-registration: ${AICOSTOPS_ALLOW_PUBLIC_REGISTRATION:false}
    public-registration-org-slug: ${PUBLIC_REGISTRATION_ORG_SLUG:local-dev}
    jwt-signing-secret: ${AICOSTOPS_JWT_SIGNING_KEY:}
    access-token-lifetime: ${AICOSTOPS_ACCESS_TOKEN_LIFETIME:15m}
    refresh-session-lifetime: ${AICOSTOPS_REFRESH_SESSION_LIFETIME:7d}
    refresh-cookie-secure: ${AICOSTOPS_REFRESH_COOKIE_SECURE:true}
    refresh-race-window: ${AICOSTOPS_REFRESH_RACE_WINDOW:10s}
    login-window: ${AICOSTOPS_LOGIN_RATE_LIMIT_WINDOW:15m}
    login-ip-limit: ${AICOSTOPS_LOGIN_IP_LIMIT:20}
    login-account-limit: ${AICOSTOPS_LOGIN_ACCOUNT_LIMIT:8}
    security-cache-ttl: ${AICOSTOPS_SECURITY_CACHE_TTL:1m}
    allowed-origins: ${AICOSTOPS_ALLOWED_ORIGINS:http://localhost:8080}
    password-reset-lifetime: ${AICOSTOPS_PASSWORD_RESET_LIFETIME:30m}
    password-reset-limit: ${AICOSTOPS_PASSWORD_RESET_LIMIT:5}
    dev-mailbox-path: ${AICOSTOPS_DEV_MAILBOX_PATH:.local-dev/mailbox}
    dev-reset-page-url: ${AICOSTOPS_DEV_RESET_PAGE_URL:http://localhost:8080/reset-password}
