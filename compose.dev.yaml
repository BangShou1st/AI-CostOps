services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PUBLIC_REGISTRATION_ORG_SLUG: ${PUBLIC_REGISTRATION_ORG_SLUG:-local-dev}
      AICOSTOPS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT}
      AICOSTOPS_REFRESH_COOKIE_SECURE: "false"
      AICOSTOPS_DEV_MAILBOX_PATH: /var/lib/aicostops/mailbox
      AICOSTOPS_DEV_RESET_PAGE_URL: http://localhost:${FRONTEND_PORT}/reset-password
      AICOSTOPS_IAM_DEV_INVITATION_MAILBOX_PATH: /var/lib/aicostops/invitations
      AICOSTOPS_IAM_DEV_INVITE_PAGE_URL: http://localhost:${FRONTEND_PORT}/invite
    volumes:
      - dev-invitation-mailbox-data:/var/lib/aicostops/invitations
  mysql:
    ports:
      - "${MYSQL_PORT}:3306"

  redis:
    ports:
      - "${REDIS_PORT}:6379"

  minio:
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

volumes:
  dev-invitation-mailbox-data:
