services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PUBLIC_REGISTRATION_ORG_SLUG: ${PUBLIC_REGISTRATION_ORG_SLUG:-local-dev}
      AICOSTOPS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT}
      AICOSTOPS_REFRESH_COOKIE_SECURE: "false"
    ports:
      - "${BACKEND_PORT}:8080"

  mysql:
    ports:
      - "${MYSQL_PORT}:3306"

  redis:
    ports:
      - "${REDIS_PORT}:6379"

  minio:
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
