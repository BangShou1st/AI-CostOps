name: Bug
description: 报告可复现的缺陷
title: "fix: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: Test、Log（注意脱敏）、Screenshot、Trace ID 等。
    validations:
      required: false

  - type: textarea
    id: design
    attributes:
      label: Related Design / Invariant
      description: 是否违反某个 INV-* / API / Transaction 约束？
    validations:
      required: false
