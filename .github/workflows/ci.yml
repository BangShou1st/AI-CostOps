name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scripts-unit:
    name: scripts-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
      - name: Test workspace scripts
        shell: bash
        run: |
          mkdir -p test-results/scripts
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-results/scripts/unit.xml \
            'scripts/tests/*.test.mjs'
      - name: Upload script unit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scripts-unit-${{ matrix.os }}
          if-no-files-found: warn
          path: test-results/scripts/

  scripts-lifecycle:
    name: scripts-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AICOSTOPS_TASK_TEST_ARTIFACT_DIR: test-results/scripts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
      - name: Prepare Docker fixtures
        run: |
          docker info
          docker compose version
          docker pull redis:8.8.1-alpine
      - name: Test workspace lifecycle commands
        run: |
          mkdir -p test-results/scripts
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-results/scripts/lifecycle.xml \
            'scripts/tests/*.integration.mjs'
      - name: Upload script lifecycle reports and fixture logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scripts-lifecycle
          if-no-files-found: warn
          path: test-results/scripts/

  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ZEN_MAVEN_USER: BangShou1st
      ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
          # Private OpenCode Zen package (GitHub Packages): writes ~/.m2/settings.xml with a
          # "github" server whose credentials come from the env vars set at job level.
          server-id: github
          server-username: ZEN_MAVEN_USER
          server-password: ZEN_MAVEN_TOKEN
      - run: ./mvnw -B -DexcludedGroups=architecture,integration test

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ZEN_MAVEN_USER: BangShou1st
      ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
          # Private OpenCode Zen package (GitHub Packages): writes ~/.m2/settings.xml with a
          # "github" server whose credentials come from the env vars set at job level.
          server-id: github
          server-username: ZEN_MAVEN_USER
          server-password: ZEN_MAVEN_TOKEN
      # Failsafe selects *IntegrationTest by filename. A tag filter silently
      # drops existing untagged integration tests, so verify the full lifecycle.
      - run: ./mvnw -B verify
      - name: Upload backend Failsafe reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-failsafe-reports
          if-no-files-found: ignore
          path: backend/target/failsafe-reports/

  backend-architecture:
    name: backend-architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ZEN_MAVEN_USER: BangShou1st
      ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
          # Private OpenCode Zen package (GitHub Packages): writes ~/.m2/settings.xml with a
          # "github" server whose credentials come from the env vars set at job level.
          server-id: github
          server-username: ZEN_MAVEN_USER
          server-password: ZEN_MAVEN_TOKEN
      - run: ./mvnw -B -Dgroups=architecture test

  gateway-unit:
    name: gateway-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    env:
      ZEN_MAVEN_USER: BangShou1st
      ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/pom.xml
          # Private OpenCode Zen package (GitHub Packages): writes ~/.m2/settings.xml with a
          # "github" server whose credentials come from the env vars set at job level.
          server-id: github
          server-username: ZEN_MAVEN_USER
          server-password: ZEN_MAVEN_TOKEN
      - run: ./mvnw -B -DexcludedGroups=architecture,integration test

  gateway-integration:
    name: gateway-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    env:
      ZEN_MAVEN_USER: BangShou1st
      ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/pom.xml
          # Private OpenCode Zen package (GitHub Packages): writes ~/.m2/settings.xml with a
          # "github" server whose credentials come from the env vars set at job level.
          server-id: github
          server-username: ZEN_MAVEN_USER
          server-password: ZEN_MAVEN_TOKEN
      # Keep every Failsafe integration class, including those without @Tag.
      - run: ./mvnw -B verify

  gateway-architecture:
    name: gateway-architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    env:
      ZEN_MAVEN_USER: BangShou1st
      ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/pom.xml
          # Private OpenCode Zen package (GitHub Packages): writes ~/.m2/settings.xml with a
          # "github" server whose credentials come from the env vars set at job level.
          server-id: github
          server-username: ZEN_MAVEN_USER
          server-password: ZEN_MAVEN_TOKEN
      - run: ./mvnw -B -Dgroups=architecture test

  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write Maven settings for the private OpenCode Zen package
        env:
          ZEN_MAVEN_USER: BangShou1st
          ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${ZEN_MAVEN_USER}</username>
                <password>${ZEN_MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - run: docker build --secret id=zen-maven-settings,src="$HOME/.m2/settings.xml" --tag ai-costops-backend:ci backend
      - run: docker build --tag ai-costops-frontend:ci frontend
      - run: docker build --secret id=zen-maven-settings,src="$HOME/.m2/settings.xml" --tag ai-costops-gateway:ci gateway

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_ENV_FILE: .e2e-ci.env
    steps:
      - uses: actions/checkout@v6

      - name: Write isolated CI-only Compose environment
        run: |
          cat > "$E2E_ENV_FILE" <<'EOF'
          MYSQL_DATABASE=aicostops
          MYSQL_USER=aicostops
          MYSQL_PASSWORD=ci-e2e-mysql-only
          MYSQL_ROOT_PASSWORD=ci-e2e-root-only
          FRONTEND_PORT=8080
          REDIS_PASSWORD=ci-e2e-redis-only
          MINIO_ROOT_USER=aicostops
          MINIO_ROOT_PASSWORD=ci-e2e-minio-only
          MINIO_BUCKET=aicostops-evidence
          AICOSTOPS_JWT_SIGNING_KEY=ci-e2e-synthetic-signing-key-change-before-production-2026
          AICOSTOPS_ALLOW_PUBLIC_REGISTRATION=true
          PUBLIC_REGISTRATION_ORG_SLUG=local-dev
          AICOSTOPS_ALLOWED_ORIGINS=http://localhost:8080
          AICOSTOPS_REFRESH_COOKIE_SECURE=false
          AICOSTOPS_DEV_BOOTSTRAP_ENABLED=true
          AICOSTOPS_DEV_BOOTSTRAP_EMAIL=admin@example.test
          AICOSTOPS_DEV_BOOTSTRAP_DISPLAY_NAME=AI CostOps CI E2E Admin
          AICOSTOPS_DEV_BOOTSTRAP_PASSWORD=ci-e2e-admin-password-2026
          SPRING_PROFILES_ACTIVE=dev
          AICOSTOPS_GATEWAY_DEV_BOOTSTRAP_ENABLED=true
          AICOSTOPS_GATEWAY_DEV_RAW_KEY=aic_0123456789ab_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          AICOSTOPS_GATEWAY_CREDENTIAL_HMAC_KEY_V1=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          AICOSTOPS_GATEWAY_REQUEST_HMAC_KEY_V1=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          AICOSTOPS_PROVIDER_KEK_V1=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          AICOSTOPS_MIMO_API_KEY=ci-e2e-mimo-api-key-only
          AICOSTOPS_LOGIN_ACCOUNT_LIMIT=500
          AICOSTOPS_LOGIN_IP_LIMIT=500
          EOF

      - name: Write Maven settings for the private OpenCode Zen package
        env:
          ZEN_MAVEN_USER: BangShou1st
          ZEN_MAVEN_TOKEN: ${{ secrets.ZEN_MAVEN_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${ZEN_MAVEN_USER}</username>
                <password>${ZEN_MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "ZEN_MAVEN_SETTINGS_FILE=$HOME/.m2/settings.xml" >> "$GITHUB_ENV"

      - name: Start isolated full Compose project
        run: |
          docker compose -p aicostops-browser-e2e --env-file "$E2E_ENV_FILE" \
            up -d --build --wait --wait-timeout 360

      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          AICOSTOPS_E2E_BASE_URL: http://localhost:8080
          AICOSTOPS_E2E_ADMIN_EMAIL: admin@example.test
          AICOSTOPS_E2E_ADMIN_PASSWORD: ci-e2e-admin-password-2026
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/playwright-results.xml

      - name: Clean up the E2E Compose project
        if: always()
        run: |
          docker compose -p aicostops-browser-e2e --env-file "$E2E_ENV_FILE" \
            down --volumes --remove-orphans
