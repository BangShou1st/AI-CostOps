name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
      code: ${{ steps.filter.outputs.code }}
      # docs_only is only a proof when no non-documentation path changed.
      # Without the second term, a docs+deploy change (or a .github-only
      # change) could claim "docs only" and let every required job skip.
      docs_only: ${{ steps.filter.outputs.docs_only == 'true' && steps.filter.outputs.code != 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'compose*.yaml'
              - '.github/workflows/ci.yml'
            gateway:
              - 'gateway/**'
              - 'docker-compose*.yml'
              - 'compose*.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - 'compose*.yaml'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'package*.json'
              - '.github/workflows/ci.yml'
            # Every path that is not a documentation-only asset. A docs-only
            # change set is the only one allowed to skip all required jobs.
            code:
              - 'backend/**'
              - 'gateway/**'
              - 'frontend/**'
              - 'scripts/**'
              - 'package*.json'
              - 'compose*.yaml'
              - 'docker-compose*.yml'
              - 'deploy/**'
              - '.github/**'
              - '.trivyignore'
              - '.env.example'
              - 'Dockerfile*'
              - '.dockerignore'
            docs_only:
              - 'docs/**'
              - '*.md'
              - 'LICENSE'
              - '.gitignore'

  scripts-unit:
    name: scripts-unit (${{ matrix.os }})
    needs: [detect-changes]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.scripts }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping scripts-unit: no relevant script changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"

      - name: Test workspace scripts
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p test-results/scripts
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-results/scripts/unit.xml \
            'scripts/tests/*.test.mjs'

      - name: Upload script unit reports
        if: always() && steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: scripts-unit-${{ matrix.os }}
          if-no-files-found: warn
          path: test-results/scripts/

  scripts-lifecycle:
    name: scripts-lifecycle
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AICOSTOPS_TASK_TEST_ARTIFACT_DIR: test-results/scripts
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.scripts }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping scripts-lifecycle: no relevant script changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"

      - name: Prepare Docker fixtures
        if: steps.check.outputs.should_run == 'true'
        run: |
          docker info
          docker compose version
          docker pull redis:8.8.1-alpine

      - name: Test workspace lifecycle commands
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p test-results/scripts
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-results/scripts/lifecycle.xml \
            'scripts/tests/*.integration.mjs'

      - name: Upload script lifecycle reports and fixture logs
        if: always() && steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: scripts-lifecycle
          if-no-files-found: warn
          path: test-results/scripts/

  backend-unit:
    name: backend-unit
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping backend-unit: no relevant backend changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Run Surefire unit tests and ArchUnit architecture tests in a single VM
      - name: Run backend unit and architecture tests
        if: steps.check.outputs.should_run == 'true'
        working-directory: backend
        run: ./mvnw -B -DexcludedGroups=integration test

  backend-integration:
    name: backend-integration (shard ${{ matrix.shard }})
    needs: [detect-changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping backend-integration: no relevant backend changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Partition integration tests across shards. The selector fails the step
      # on an empty enumeration or an empty shard, so this required job can
      # never pass while running zero tests.
      - name: Run backend integration tests shard ${{ matrix.shard }}
        if: steps.check.outputs.should_run == 'true'
        working-directory: backend
        shell: bash
        run: |
          TESTS=$(node ../scripts/ci/select-integration-tests.mjs --shard ${{ matrix.shard }} --shards 2)
          echo "Selected $(echo "$TESTS" | tr ',' '\n' | wc -l) integration tests for shard ${{ matrix.shard }}"
          ./mvnw -B verify -Dsurefire.skip=true "-Dit.test=$TESTS" -DfailIfNoTests=true

      - name: Upload backend Failsafe reports
        if: always() && steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: backend-failsafe-reports-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          path: backend/target/failsafe-reports/

  gateway-unit:
    name: gateway-unit
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.gateway }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping gateway-unit: no relevant gateway changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/pom.xml

      # Run Surefire unit tests and ArchUnit architecture tests in a single VM
      - name: Run gateway unit and architecture tests
        if: steps.check.outputs.should_run == 'true'
        working-directory: gateway
        run: ./mvnw -B -DexcludedGroups=integration test

  gateway-integration:
    name: gateway-integration
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.gateway }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping gateway-integration: no relevant gateway changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/pom.xml

      # Skip Surefire unit tests (-Dsurefire.skip=true) and run integration tests
      - name: Run gateway integration tests
        if: steps.check.outputs.should_run == 'true'
        working-directory: gateway
        run: ./mvnw -B verify -Dsurefire.skip=true

  frontend-quality:
    name: frontend-quality (lint & build)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping frontend-quality: no relevant frontend changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        run: npm run build

  frontend-test:
    name: frontend-test
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping frontend-test: no relevant frontend changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        run: npm test -- --run

  docker-build:
    name: docker-build
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.backend }}" = "true" ] || [ "${{ needs.detect-changes.outputs.gateway }}" = "true" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping docker-build: no application code changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Build all container images in parallel
        if: steps.check.outputs.should_run == 'true'
        run: |
          docker build --tag ai-costops-backend:ci backend & p1=$!
          docker build --tag ai-costops-frontend:ci frontend & p2=$!
          docker build --tag ai-costops-gateway:ci gateway & p3=$!
          # Bare `wait` always exits 0 and would swallow a failed build,
          # letting the required docker-build check pass on a broken image.
          status=0
          wait $p1 || status=1
          wait $p2 || status=1
          wait $p3 || status=1
          exit $status

  browser-e2e:
    name: browser-e2e
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_ENV_FILE: .e2e-ci.env
      AICOSTOPS_M22_COMPOSE_PROJECT: aicostops-browser-e2e
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Check change admission
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ needs.detect-changes.outputs.backend }}" = "true" ] || [ "${{ needs.detect-changes.outputs.gateway }}" = "true" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping browser-e2e: no application code changes."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Write isolated CI-only Compose environment
        if: steps.check.outputs.should_run == 'true'
        run: |
          cat > "$E2E_ENV_FILE" <<'EOF'
          MYSQL_DATABASE=aicostops
          MYSQL_USER=aicostops
          MYSQL_PASSWORD=ci-e2e-mysql-only
          MYSQL_ROOT_PASSWORD=ci-e2e-root-only
          FRONTEND_PORT=8080
          REDIS_PASSWORD=ci-e2e-redis-only
          MINIO_ROOT_USER=aicostops
          MINIO_ROOT_PASSWORD=ci-e2e-minio-only
          MINIO_BUCKET=aicostops-evidence
          AICOSTOPS_JWT_SIGNING_KEY=ci-e2e-synthetic-signing-key-change-before-production-2026
          AICOSTOPS_ALLOW_PUBLIC_REGISTRATION=true
          PUBLIC_REGISTRATION_ORG_SLUG=local-dev
          AICOSTOPS_ALLOWED_ORIGINS=http://localhost:8080
          AICOSTOPS_REFRESH_COOKIE_SECURE=false
          AICOSTOPS_DEV_BOOTSTRAP_ENABLED=true
          AICOSTOPS_DEV_BOOTSTRAP_EMAIL=admin@example.test
          AICOSTOPS_DEV_BOOTSTRAP_DISPLAY_NAME=AI CostOps CI E2E Admin
          AICOSTOPS_DEV_BOOTSTRAP_PASSWORD=ci-e2e-admin-password-2026
          SPRING_PROFILES_ACTIVE=dev
          AICOSTOPS_GATEWAY_DEV_BOOTSTRAP_ENABLED=true
          AICOSTOPS_GATEWAY_DEV_RAW_KEY=aic_0123456789ab_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          AICOSTOPS_GATEWAY_CREDENTIAL_HMAC_KEY_V1=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          AICOSTOPS_GATEWAY_REQUEST_HMAC_KEY_V1=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          AICOSTOPS_PROVIDER_KEK_V1=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          AICOSTOPS_MIMO_API_KEY=ci-e2e-mimo-api-key-only
          AICOSTOPS_LOGIN_ACCOUNT_LIMIT=500
          AICOSTOPS_LOGIN_IP_LIMIT=500
          EOF

      - name: Start isolated full Compose project
        if: steps.check.outputs.should_run == 'true'
        run: |
          docker compose -p aicostops-browser-e2e --env-file "$E2E_ENV_FILE" \
            up -d --build --wait --wait-timeout 360

      - if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browser binaries
        if: steps.check.outputs.should_run == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium binaries
        if: steps.check.outputs.should_run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.check.outputs.should_run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        if: steps.check.outputs.should_run == 'true'
        working-directory: frontend
        env:
          AICOSTOPS_E2E_BASE_URL: http://localhost:8080
          AICOSTOPS_E2E_ADMIN_EMAIL: admin@example.test
          AICOSTOPS_E2E_ADMIN_PASSWORD: ci-e2e-admin-password-2026
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure() && steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/playwright-results.xml

      - name: Clean up the E2E Compose project
        if: always() && steps.check.outputs.should_run == 'true'
        run: |
          docker compose -p aicostops-browser-e2e --env-file "$E2E_ENV_FILE" \
            down --volumes --remove-orphans

  ci-status:
    name: ci-status
    needs:
      - detect-changes
      - scripts-unit
      - scripts-lifecycle
      - backend-unit
      - backend-integration
      - gateway-unit
      - gateway-integration
      - frontend-quality
      - frontend-test
      - docker-build
      - browser-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
          BACKEND: ${{ needs.detect-changes.outputs.backend }}
          GATEWAY: ${{ needs.detect-changes.outputs.gateway }}
          FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          SCRIPTS: ${{ needs.detect-changes.outputs.scripts }}
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          SCRIPTS_UNIT: ${{ needs.scripts-unit.result }}
          SCRIPTS_LIFECYCLE: ${{ needs.scripts-lifecycle.result }}
          BACKEND_UNIT: ${{ needs.backend-unit.result }}
          BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          GATEWAY_UNIT: ${{ needs.gateway-unit.result }}
          GATEWAY_INTEGRATION: ${{ needs.gateway-integration.result }}
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          FRONTEND_TEST: ${{ needs.frontend-test.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          BROWSER_E2E: ${{ needs.browser-e2e.result }}
          # Every job runs unconditionally on main, so a skip there is never
          # justified regardless of the path filters.
          FORCED: ${{ github.ref == 'refs/heads/main' }}
        run: |
          fail=0

          # A skip is a failure unless the detect-changes filter for that job
          # did not match. This is the "no unexplained skipped" rule; the
          # all-skipped check below closes the out-of-band path hole
          # (.github/**, deploy/**, .trivyignore) that the old gate let pass.
          check() {
            local name="$1" result="$2" expected="$3"
            if [ "$FORCED" = "true" ]; then expected="true"; fi
            case "$result" in
              success)
                return 0
                ;;
              skipped)
                if [ "$expected" = "true" ]; then
                  echo "::error::${name} was skipped although its change filter matched."
                  fail=1
                fi
                ;;
              *)
                echo "::error::${name} ended as '${result}'."
                fail=1
                ;;
            esac
          }

          check detect-changes "$DETECT_CHANGES" true
          check scripts-unit "$SCRIPTS_UNIT" "$SCRIPTS"
          check scripts-lifecycle "$SCRIPTS_LIFECYCLE" "$SCRIPTS"
          check backend-unit "$BACKEND_UNIT" "$BACKEND"
          check backend-integration "$BACKEND_INTEGRATION" "$BACKEND"
          check gateway-unit "$GATEWAY_UNIT" "$GATEWAY"
          check gateway-integration "$GATEWAY_INTEGRATION" "$GATEWAY"
          check frontend-quality "$FRONTEND_QUALITY" "$FRONTEND"
          check frontend-test "$FRONTEND_TEST" "$FRONTEND"

          APP_CODE=false
          if [ "$BACKEND" = "true" ] || [ "$GATEWAY" = "true" ] || [ "$FRONTEND" = "true" ]; then
            APP_CODE=true
          fi
          check docker-build "$DOCKER_BUILD" "$APP_CODE"
          check browser-e2e "$BROWSER_E2E" "$APP_CODE"

          if [ "$DOCS_ONLY" != "true" ] \
            && [ "$BACKEND" != "true" ] && [ "$GATEWAY" != "true" ] \
            && [ "$FRONTEND" != "true" ] && [ "$SCRIPTS" != "true" ]; then
            echo "::error::No tracked application area changed and the change set is not docs-only; changes outside the known filters (for example .github/**, deploy/** or .trivyignore) cannot pass this gate silently."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "One or more required jobs did not satisfy the merge gate."
            exit 1
          fi
          echo "All required checks passed (docs_only=$DOCS_ONLY)."
