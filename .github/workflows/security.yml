name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    permissions:
      contents: read
      # Only this job may upload security events; the workflow stays read-only.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Setup runtime only for the target language matrix to avoid cross-language setup overhead
      - name: Set up JDK 21 for Java CodeQL
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            gateway/pom.xml

      - name: Set up Node.js for JS/TS CodeQL
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      # Real builds so the extractors observe actual code, not just syntax.
      - name: Build real sources for the extractor
        shell: bash
        run: |
          if [ "${{ matrix.language }}" = "java-kotlin" ]; then
            (cd backend && ./mvnw -B -DskipTests package)
            (cd gateway && ./mvnw -B -DskipTests package)
          else
            (cd frontend && npm ci && npm run build)
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: trivy-db-v0.73.0-${{ hashFiles('backend/pom.xml', 'gateway/pom.xml', 'frontend/package-lock.json') }}
          restore-keys: |
            trivy-db-v0.73.0-

      - name: Build security images in parallel
        run: |
          docker build --tag ai-costops-backend:security backend & p1=$!
          docker build --tag ai-costops-frontend:security frontend & p2=$!
          docker build --tag ai-costops-gateway:security gateway & p3=$!
          # Bare `wait` always exits 0 and would swallow a failed build,
          # letting Trivy scan a missing image. Propagate every failure.
          status=0
          wait $p1 || status=1
          wait $p2 || status=1
          wait $p3 || status=1
          exit $status

      # Filesystem scan must cover the approved AIC-079 surface:
      #   vuln + misconfig + secret, severity HIGH,CRITICAL, exit-code 1.
      - name: Trivy filesystem scan (vuln, misconfig, secret)
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            -v "${PWD}:/workspace" \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --offline-scan \
            --skip-dirs /workspace/.git,/workspace/frontend/node_modules,/workspace/frontend/dist,/workspace/frontend/playwright-report,/workspace/frontend/test-results,/workspace/backend/target,/workspace/gateway/target,/workspace/.trivy-cache \
            /workspace

      - name: Trivy backend image scan (vuln)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ai-costops-backend:security

      - name: Trivy frontend image scan (vuln)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ai-costops-frontend:security

      - name: Trivy gateway image scan (vuln)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ai-costops-gateway:security
