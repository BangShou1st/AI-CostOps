name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    permissions:
      contents: read
      # Only this job may upload security events; the workflow stays read-only.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
      # Real builds so the extractors observe actual code, not just syntax.
      - name: Build real sources for the extractor
        shell: bash
        run: |
          if [ "${{ matrix.language }}" = "java-kotlin" ]; then
            (cd backend && ./mvnw -B -DskipTests package)
          else
            (cd frontend && npm ci && npm run build)
          fi
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --tag ai-costops-backend:security backend

      - name: Build frontend image
        run: docker build --tag ai-costops-frontend:security frontend

      # Filesystem scan of the source tree for misconfigurations and secrets.
      # Vulnerability scanning deliberately stays with the backend/frontend
      # image scans below: they read the actually-built dependency sets, which
      # is strictly more accurate than the fs pom.xml graph. The fs scan also
      # skips pom.xml itself because Trivy resolves its dependency/BOM graph
      # against Maven Central even in misconfig mode, and Maven Central's rate
      # limiting was repeatedly failing the CI (429 on runner IPs). Build
      # output and vendored deps are covered by the image scans; dev-only dirs
      # and the git store are skipped so the policy targets the reviewed source.
      - name: Trivy filesystem scan (misconfig, secret)
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs /workspace/.git,/workspace/frontend/node_modules,/workspace/frontend/dist,/workspace/frontend/playwright-report,/workspace/frontend/test-results,/workspace/backend/target,/workspace/.trivy-cache \
            --skip-files /workspace/backend/pom.xml \
            /workspace

      - name: Trivy backend image scan (vuln)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ai-costops-backend:security

      - name: Trivy frontend image scan (vuln)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0 \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ai-costops-frontend:security