name: "AI CostOps CodeQL configuration"

# Follow-security queries plus the app source trees. Build output, vendored
# dependencies and generated test artifacts are intentionally excluded; the
# dependency risk surface is covered by the Trivy image scans.
queries:
  - uses: security-and-quality

paths:
  - backend/src
  - frontend/src
  - gateway/src

paths-ignore:
  - "**/target/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/playwright-report/**"
  - "**/test-results/**"

# The Gateway data plane authenticates via a Bearer API-key filter, issues no
# cookies and keeps no server session (frozen AIC-091: "API-key surface, not
# a browser cookie product"). Spring Security's CSRF protection is therefore
# intentionally disabled; CSRF is a cookie/session attack model that does not
# apply to credentials carried only in request headers.
query-filters:
  - exclude:
      id: java/spring-csrf-disabled
  - exclude:
      id: java/csrf-unprotected-request-type