global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: aicostops-observability

scrape_configs:
  - job_name: aicostops-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: aicostops-backend

rule_files:
  - /etc/prometheus/alerts.yml
